spring.application.name=deliveryflow

# ---------- Database ----------
# Dedicated app user; the MySQL root account is never used by the application.
spring.datasource.url=jdbc:mysql://localhost:3306/deliveryflow?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:deliveryflow}
spring.datasource.password=${DB_PASSWORD:deliveryflow123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Seed data (data.sql) must run after Hibernate has created the tables.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ---------- Server ----------
server.port=8080

# ---------- Swagger / OpenAPI ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.api-docs.path=/v3/api-docs
